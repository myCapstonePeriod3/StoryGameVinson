<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Space Station Game</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="game.html">Play the game</a></li>
                    <li><a href="about.html">About the creator</a></li>
                </ul>
            </nav>
        </header>

        <div class="game-card">
            <h1 id="scene-title" class="game-heading">Location: Control Room</h1>
            <h2 id="character-name"></h2>
        </div>

        <div class="game-card">
            <section>
                <img id="scene-image" src="https://img.magnific.com/free-vector/spaceship-control-center-illustration_107791-5306.jpg?semt=ais_hybrid&w=740&q=80" alt="scene image">
            </section>

            <section>
                <p id="scene-text">The main room with red emergency light and broken screen and monitor</p>
            </section>

            <section>
                <div id="choices-container"></div>
            </section>
        </div>

        <section id="sanity-panel">
            <p>SANITY LEVEL:</p>
            <ul>
                <li id="health-display">100%</li>
            </ul>
        </section>

        <div class="game-card">
            <p style="color: #00f0ff; font-family: 'Orbitron', sans-serif; text-align: left; margin-top: 0;">INVENTORY:</p>
            <div id="inventory-display">None</div>
            <p id="message-display"></p>
            <p id="codeTracker-display"></p>
            <p id="messageCode-display"></p>
        </div>
    </main>
</body>
</html>
