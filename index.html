<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>  
                <li><a href="index.html">Home</a></li>
            </ul>
            <ul>  
                <li><a href="game.html">Play the game</a></li>
            </ul>
            <ul>  
                <li><a href="about.html">About the creator</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="game-card">
            <h1 class="game-heading">Home Page</h1>
        </div>

        <div class="game-card" style="text-align: left;">
            <form action="game.html" method="get">
                <!-- Letter Selection -->
                <p>
                    <label for="letter">Choose the best letter:</label><br>
                    <select name="letter" id="letter" style="background: #12131c; color: #00f0ff; border: 1px solid #00f0ff; padding: 5px; font-family: 'Share Tech Mono', monospace;">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                        <option value="G">G</option>
                        <option value="H">H</option>
                        <option value="I">I</option>
                        <option value="J">J</option>
                        <option value="K">K</option>
                        <option value="L">L</option>
                        <option value="M">M</option>
                        <option value="N">N</option>
                        <option value="O">O</option>
                        <option value="P">P</option>
                        <option value="Q">Q</option>
                        <option value="R">R</option>
                        <option value="S">S</option>
                        <option value="T">T</option>
                        <option value="U">U</option>
                        <option value="V">V</option>
                        <option value="W">W</option>
                        <option value="X">X</option>
                        <option value="Y">Y</option>
                        <option value="Z">Z</option>
                    </select>
                </p>

                <!-- Animal Selection -->
                <p>
                    <label for="Animal">What animal would you eat if you were stranded on a desert island?</label><br>
                    <input type="radio" name="Animal" value="Dog">Dog<br>
                    <input type="radio" name="Animal" value="Cat">Cat<br>
                    <input type="radio" name="Animal" value="Rat">Rat<br>
                    <input type="radio" name="Animal" value="Pufferfish">Pufferfish<br>
                    <input type="radio" name="Animal" value="Your friend">Your friend<br>
                    <input type="radio" name="Animal" value="Yourself">Yourself
                </p>

                <!-- Money Selection -->
                <p>
                    <label for="money">If your SSN was the number of how much you have in your bank account, what would it be?</label><br>
                    <input type="number" id="money" name="money" placeholder="Definitely Not your SSN" min="100000000" max="999999999" style="background: #12131c; color: #e1e1e6; border: 1px solid #00f0ff; padding: 5px; width: 80%;">
                </p>

                <!-- Self Selection -->
                <p>
                    <label for="self">What would you do if you werent alive?</label><br>
                    <input type="text" id="self" name="self" placeholder="Type Here" style="background: #12131c; color: #e1e1e6; border: 1px solid #00f0ff; padding: 5px; width: 80%;">
                </p>

                <p style="text-align: center; margin-top: 20px;">
                    <input type="submit" value="Submit" style="background-color: #12131c; color: #00f0ff; border: 1px solid #00f0ff; padding: 10px 20px; font-family: 'Orbitron', sans-serif; cursor: pointer; border-radius: 4px;">
                </p>
            </form>
        </div>

        <div class="game-card" style="text-align: center;">
            <p>
                <a href="https://www.youtube.com/">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo" width="100" style="margin-top: 10px;">
                </a>
            </p>
        </div>
    </main>

    <footer></footer>
</body>
</html>
