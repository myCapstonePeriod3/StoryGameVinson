 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
 </head>
 <body>
    <h1>Home Page</h1>

    <form action="game.html" method="get">

        <!-- Letter Selection -->
        <p>
        <label for="letter">Choose the best letter:</label>
        <select name="letter" id="letter">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
            <option value="H">H</option>
            <option value="I">I</option>
            <option value="J">J</option>
            <option value="K">K</option>
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="N">N</option>
            <option value="O">O</option>
            <option value="P">P</option>
            <option value="Q">Q</option>
            <option value="R">R</option>
            <option value="S">S</option>
            <option value="T">T</option>
            <option value="U">U</option>
            <option value="V">V</option>
            <option value="W">W</option>
            <option value="X">X</option>
            <option value="Y">Y</option>
            <option value="Z">Z</option>
        </select>
        </p>

        <!-- Animal Selection -->
        <p>
            <p>
            <label for="Animal">What animal would you eat if you were stranded on a desert island?</label>
            </p>
            <input type="radio" name="Animal" value="Dog">Dog
            <input type="radio" name="Animal" value="Cat">Cat
            <input type="radio" name="Animal" value="Cow">Rat
            <input type="radio" name="Animal" value="Pufferfish">Pufferfish
            <input type="radio" name="Animal" value="Your friend">Your friend
            <input type="radio" name="Animal" value="Yourself">Yourself
        </p>

        <!-- Money Selection -->
        <p>
            <label for="money">If your SSN was the number of how much you have in your bank account, what would it be?</label>
            <input type="number" id="money" name="money" placeholder="Definitely Not your SSN" min="100000000" max="999999999">
        </p>

        <!-- Self Selection -->
        <p>
            <label for="self">What would you do if you werent alive?</label>
            <input type="text" id="self" name="self" placeholder="Type Here">
        </p>

        <p>
            <input type="submit" value="Submit">
        </p>
    </form>

    <!-- Links -->
    <p>
        <a href="about.html">About the creator</a><br>
    </p>

    <a href="https://www.youtube.com/">

 </body>
 </html>
